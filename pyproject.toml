[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-guardian"
version = "1.0.0"
description = "Local, changed-lines security checks for code review"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["security", "git", "secrets", "static-analysis", "sarif"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
audit = ["pip-audit>=2.9,<3"]

[project.scripts]
ai-code-guardian = "ai_code_guardian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
