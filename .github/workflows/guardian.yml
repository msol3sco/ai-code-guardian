name: Guardian
on:
  pull_request:

permissions:
  contents: read

jobs:
  changed-lines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Scan pull request
        id: guardian
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ai-code-guardian scan --diff "$BASE_SHA" --format sarif --output "$RUNNER_TEMP/guardian.sarif"
      - name: Save report
        if: ${{ !cancelled() && (steps.guardian.outcome == 'success' || steps.guardian.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: guardian-sarif
          path: ${{ runner.temp }}/guardian.sarif
          if-no-files-found: error
          retention-days: 7
