name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: ai-code-guardian --version

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build twine pre-commit
      - run: pre-commit validate-manifest .pre-commit-hooks.yaml
      - run: pre-commit validate-config examples/pre-commit-config.yaml
      - run: pre-commit validate-config examples/pre-commit-with-ruff.yaml
      - run: python -m build
      - run: python -m twine check --strict dist/*
